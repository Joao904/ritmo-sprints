name: Android

# Compila, executa testes e gera as capturas de evidência em um emulador.
# Resultados ficam no artefato "validacao" de cada execução.
on:
  push:
  workflow_dispatch:

env:
  # Passos de evidência executados em processos separados, na ordem
  # (o app é encerrado entre um passo e outro).
  EVIDENCE_STEPS: "Sprint04Evidence#invalidInput Sprint04Evidence#validInput Sprint05Evidence#createData Sprint05Evidence#restoreData"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: projects/team-09/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, unit tests and lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/build-unit-lint.txt"
          find app/build/test-results -name 'TEST-*.xml' -exec cp {} "$GITHUB_WORKSPACE/ci-out/" \; || true
          cp app/build/reports/lint-results-debug.txt "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true

      - name: Instrumented tests and evidence (Pixel 6, API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: projects/team-09/app
          script: bash ../../../.github/scripts/emulator.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao
          path: ci-out/
